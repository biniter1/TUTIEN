version: "3.9"

services:
  db:
    image: postgres:16
    container_name: tutien_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutien}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutien_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tutien_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
